<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SPCA Service Tracking Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --radius: 16px;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 40px;
      color: #111;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 32px;
      text-align: center;
      font-weight: 700;
    }
    section {
      margin-bottom: 80px;
    }
    h2 {
      font-size: 22px;
      margin: 40px 0 24px;
      text-align: center;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      display: block;
      background: #fff;
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .card.disabled {
      opacity: 0.5;
      cursor: default;
      pointer-events: none;
    }
    .card h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: 600;
    }
    .card p {
      margin: 0;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>

<body>
  <h1>SPCA Service Tracking Hub</h1>

  <!-- ────────────────────────────────
       Pet Food Pantry
  ────────────────────────────────── -->
  <section id="pantry">
    <h2>Pet Food Pantry</h2>
    <div class="grid" id="pantryGrid"></div>
  </section>

  <!-- ────────────────────────────────
       Scheduling
  ────────────────────────────────── -->
  <section id="scheduling">
    <h2>Scheduling</h2>
    <div class="grid" id="schedulingGrid"></div>
  </section>

  <!-- ────────────────────────────────
       Medical
  ────────────────────────────────── -->
  <section id="medical">
    <h2>Medical</h2>
    <div class="grid" id="medicalGrid"></div>
  </section>

  <!-- ────────────────────────────────
       Connections
  ────────────────────────────────── -->
  <section id="connections">
    <h2>Connections</h2>
    <div class="grid" id="connectionsGrid"></div>
  </section>

  <!-- ────────────────────────────────
       Reporting Tools
  ────────────────────────────────── -->
  <section id="reporting">
    <h2>Reporting Tools</h2>
    <div class="grid" id="reportingGrid"></div>
  </section>

  <!-- ────────────────────────────────
       Admin
  ────────────────────────────────── -->
  <section id="admin">
    <h2>Admin Tools</h2>
    <div class="grid">
      <a href="..." class="card"><h3>Script Configuration</h3><p>Manage property settings and integrations.</p></a>
      <a href="..." class="card"><h3>Merge Service</h3><p>Access the PDF merge backend.</p></a>
    </div>
  </section>

  <script>
    // ─── Pantry Apps ─────────────────────────────────────
    const pantryApps = [
      {
        id: 'pantryApp1',
        name: 'Log Supplies Distributed',
        desc: 'Used to log supplies provided to individuals or at an event and notifies the Food Pantry Team.',
        prop: 'APP_LINK_SUPPLIES_GIVEN'
      },
      {
        id: 'pantryApp2',
        name: 'Request Pantry Services',
        desc: 'An internal version of the Pantry Request form.',
        prop: 'APP_LINK_INTERNAL_PANTRY_FORM'
      },
      {
        id: 'pantryApp3',
        name: 'Daily Pantry Apps',
        desc: 'Apps supporting day-to-day pantry operations.',
        prop: 'APP_LINK_DAILY_PANTRY'
      }
    ];

    // ─── Scheduling Apps ─────────────────────────────────────
    const schedulingApps = [
      {
        id: 'schedApp1',
        name: 'Grant Appointment Scheduling',
        desc: 'Use this app to schedule grant-specific appointments with the Lipsey Clinic.',
        prop: 'APP_LINK_GRANT_SCHEDULER'
      },
      {
        id: 'schedApp2',
        name: 'Shelter-side Clinic Scheduling',
        desc: 'Used to record medical services provided to owned animals in the infirmary.',
        prop: 'APP_LINK_SHELTER_APPOINTMENTS'
      },
      {
        id: 'schedApp3',
        name: 'Outreach Home Visit Scheduling',
        desc: 'Used to schedule and track Outreach home visits.',
        prop: 'APP_LINK_HOME_VISITS'
      },
      {
        id: 'schedApp4',
        name: 'Vaccine Clinic Add-on Appointment Scheduling',
        desc: 'Used to schedule additional clients for a vaccine clinic when registration is full.',
        prop: 'APP_LINK_CLINIC_ADDON'
      }
    ];

    // ─── Medical Apps ─────────────────────────────────────
    const medicalApps = [
      {
        id: 'medApp1',
        name: 'Upload or Request Medical Records',
        desc: 'Stores and sends medical records to the larger team for upcoming appointments.',
        prop: 'APP_LINK_MED_UPLOAD'
      },
      {
        id: 'medApp2',
        name: 'Vaccine Clinic Medical Costs',
        desc: 'Used to record outreach vaccines subsidized or supplemented by grant funding.',
        prop: 'APP_LINK_VACCINE_SUBSIDY'
      },
      {
        id: 'medApp3',
        name: 'App 3',
        desc: 'Reserved for future medical services.',
        prop: null
      },
      {
        id: 'medApp4',
        name: 'Lipsey Invoice Processing',
        desc: 'Upload and process receipts for Lipsey Clinic grant reimbursement tracking.',
        prop: 'APP_LINK_LIPSEY_INVOICE'
      }
    ];

    // ─── Connections Apps ─────────────────────────────────────
    const connectionsApps = [
      {
        id: 'connectApp1',
        name: 'Create Follow-up',
        desc: 'Logs a connection and creates a scheduled follow-up for services.',
        prop: 'APP_LINK_FOLLOWUP'
      },
      {
        id: 'connectApp2',
        name: 'Call Log',
        desc: 'Manage voicemail records forwarded to the system for follow-up.',
        prop: 'APP_LINK_VOICEMAIL'
      },
      {
        id: 'connectApp3',
        name: 'App 3',
        desc: 'Reserved for future Connections tools.',
        prop: null
      },
      {
        id: 'connectApp4',
        name: 'App 4',
        desc: 'Reserved for future Connections tools.',
        prop: null
      }
    ];

    // ─── Reporting Apps ─────────────────────────────────────
    const reportingApps = [
      {
        id: 'reportApp1',
        name: 'Grant Summary Dashboard',
        desc: 'A visual summary of activities and services filterable by grant.',
        prop: 'APP_LINK_GRANT_DASHBOARD'
      },
      {
        id: 'reportApp2',
        name: 'Monthly Reports',
        desc: 'Quick access to reoccurring reports.',
        prop: 'APP_LINK_MONTHLY_REPORTS'
      },
      {
        id: 'reportApp3',
        name: 'Advanced Reporting',
        desc: 'Admin use only. Config for Reports.',
        prop: 'APP_LINK_ADMIN_REPORTS'
      }
    ];

    // ─── Generic Renderer ─────────────────────────────────────
    function renderSection(gridId, apps) {
      const grid = document.getElementById(gridId);
      apps.forEach(app => {
        const card = document.createElement('div');
        card.id = app.id;
        card.className = 'card disabled';
        card.innerHTML = `<h3>${app.name}</h3><p>${app.desc}</p>`;
        grid.appendChild(card);

        if (app.prop) {
          google.script.run
            .withSuccessHandler(link => {
              const el = document.getElementById(app.id);
              if (link) {
                el.outerHTML = `
                  <a href="${link}" target="_blank" class="card">
                    <h3>${app.name}</h3>
                    <p>${app.desc}</p>
                  </a>`;
              }
            })
            .getAppLink(app.prop);
        }
      });
    }

    // Render all sections
    renderSection('pantryGrid', pantryApps);
    renderSection('schedulingGrid', schedulingApps);
    renderSection('medicalGrid', medicalApps);
    renderSection('connectionsGrid', connectionsApps);
    renderSection('reportingGrid', reportingApps);
  </script>
</body>
</html>
